services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: posiflora
      MYSQL_USER: posiflora
      MYSQL_PASSWORD: posiflora
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: dev
      APP_SECRET: change-me-in-production
      DEFAULT_URI: http://localhost:8080
      DATABASE_URL: mysql://posiflora:posiflora@db:3306/posiflora?serverVersion=8.4
      SHOP_ID: demo
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - php

volumes:
  db_data:
